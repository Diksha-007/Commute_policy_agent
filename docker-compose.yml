services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false   # app and tests still start without a key
    environment:
      DEMO_MODE: "true"   # serves the demo page at / and lets it sign in without minting tokens; remove for real use
    volumes:
      - ./data:/app/data
      - ./eval/results:/app/eval/results   # eval outputs land on the host
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
